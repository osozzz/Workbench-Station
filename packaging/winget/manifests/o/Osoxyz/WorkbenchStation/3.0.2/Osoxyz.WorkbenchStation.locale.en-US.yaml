ShortDescription: Keeps a Windows development PC up to date, showing the risk and exact command of every update.
Description: |-
  Workbench Station audits a Windows development PC, finds what can be updated (WinGet, Chocolatey, npm and pnpm, developer tools, editors, Windows Update and your own standard), shows the risk and exact command of each update, and installs only what you confirm. It also shows what fills your drives and frees space one confirmed item at a time. Reports stay on the PC. Available in English and Spanish.
