# Weekly, grouped version updates. Security updates arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app-npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    groups:
      app-cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
