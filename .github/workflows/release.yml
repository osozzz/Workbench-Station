name: release

# Builds the signed desktop app installer for a v* tag and creates a DRAFT GitHub release with it, its
# signature, latest.json for the in-app updater, SHA256SUMS.txt and a build provenance attestation. The
# owner reviews the draft and publishes it; only a published release reaches installed apps.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release and upload its files
      id-token: write # sign the provenance attestation
      attestations: write # store it
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the app and the CHANGELOG must agree before anything is built.
      - name: Check the tag matches the app version
        id: version
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match the app version $version (src-tauri/tauri.conf.json)." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install pnpm
        run: |
          npm install --global pnpm@12.16.1

      - name: Install app dependencies
        run: |
          pnpm install --frozen-lockfile

      # rust-toolchain.toml in src-tauri pins the compiler; rustup installs it on first use.
      # tauri.release.conf.json adds the signed updater files, which need the private key.
      # The NSIS download from GitHub releases intermittently returns HTTP 504, so a failed build is retried.
      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The TAURI_SIGNING_PRIVATE_KEY secret is not set.' }
          foreach ($attempt in 1..3) {
              pnpm tauri build --config src-tauri/tauri.release.conf.json
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($attempt -lt 3) {
                  Write-Host "::warning::Build attempt $attempt failed; retrying in $(30 * $attempt) seconds."
                  Start-Sleep -Seconds (30 * $attempt)
              }
          }
          exit 1

      - name: Write the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ../.github/scripts/Write-ReleaseFiles.ps1 -Version $env:VERSION -BundleDirectory src-tauri/target/release/bundle/nsis `
            -Changelog ../CHANGELOG.md -Repository $env:GITHUB_REPOSITORY -OutputDirectory ../release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*-setup.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: release
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --repo $env:GITHUB_REPOSITORY `
            --title "Workbench Station $env:VERSION" --notes-file notes.md `
            "Workbench-Station_$($env:VERSION)_x64-setup.exe" "Workbench-Station_$($env:VERSION)_x64-setup.exe.sig" latest.json SHA256SUMS.txt
