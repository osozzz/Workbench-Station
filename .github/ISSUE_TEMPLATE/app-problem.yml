name: App problem
description: Something in the Workbench Station app didn't work as expected.
title: "[App]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't paste whole reports: they hold your PC's name, folders and projects. Copy only the lines that matter, and replace anything personal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did the app do instead? Include the message it showed, if any (the Details button copies it).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from opening the app, for example "Updates > select Git > Install 1 selected".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About.
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run winver. For example "Windows 11 24H2, build 26100".
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Spanish
  - type: textarea
    id: log
    attributes:
      label: Log lines (optional)
      description: |
        For a failed install, the run log is in %LOCALAPPDATA%\com.osozzz.workbenchstation\reports\update-log. Paste only the entry of the update that failed, with personal paths removed.
      render: json
  - type: checkboxes
    id: safety
    attributes:
      label: Before sending
      options:
        - label: This issue has no passwords, tokens, personal paths, project names or full reports.
          required: true
